<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - To-Do Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff7ea,#eef5ff);min-height:100vh;color:#1f2937}.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(31,41,55,.15);padding:32px;width:min(420px,100%)}h1,h2{margin-top:0}.brand{text-align:center;margin-bottom:24px}.brand .logo{font-size:48px}.brand p{color:#6b7280}.tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:11px;border-radius:9px;background:transparent;cursor:pointer;font-weight:700}.tabs button.active{background:#fff;box-shadow:0 2px 8px #ddd}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;outline:none}.field input:focus{border-color:#30a673;box-shadow:0 0 0 3px rgba(48,166,115,.12)}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}.primary{background:#30a673;color:#fff;width:100%;margin-top:8px}.primary:hover{background:#258b5e}.msg{min-height:20px;margin:12px 0;color:#dc2626;font-size:14px}.topbar{background:#fff;box-shadow:0 2px 15px rgba(0,0,0,.08);padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px}.topbar h1{margin:0;font-size:22px}.logout{background:#ef4444;color:#fff}.main{width:min(1000px,92%);margin:35px auto}.welcome{margin-bottom:20px}.todo-panel{background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(31,41,55,.10)}.add-row{display:flex;gap:10px;margin-bottom:20px}.add-row input{flex:1;padding:14px;border:1px solid #d1d5db;border-radius:10px}.add-row .btn{background:#30a673;color:#fff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.stat{background:#f3f4f6;padding:9px 13px;border-radius:20px;font-size:13px}.list{list-style:none;padding:0;margin:0}.item{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid #eee;animation:slide .2s ease}.item:last-child{border-bottom:0}.item span.task{flex:1;cursor:pointer}.item.completed span.task{text-decoration:line-through;color:#9ca3af}.check{width:20px;height:20px;cursor:pointer}.delete{border:0;background:#fee2e2;color:#dc2626;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}.empty{text-align:center;color:#9ca3af;padding:30px}@keyframes slide{from{transform:translateY(-5px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="authPage" class="auth"><div class="card"><div class="brand"><div class="logo">✅</div><h1>TaskFlow</h1><p>Simple. Smart. Productive.</p></div><div class="tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Login</button><button id="registerTab" onclick="showAuth('register')">Register</button></div><div id="loginForm"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Enter username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn primary" onclick="login()">Login</button></div><div id="registerForm" class="hidden"><div class="field"><label>Username</label><input id="regUser" autocomplete="username" placeholder="Create username"></div><div class="field"><label>Password</label><input id="regPass" type="password" autocomplete="new-password" placeholder="Create password"></div><button class="btn primary" onclick="register()">Create Account</button></div><div id="authMsg" class="msg"></div></div></div>
<div id="todoPage" class="app hidden"><header class="topbar"><h1>✅ TaskFlow To-Do Manager</h1><button class="btn logout" onclick="logout()">Logout</button></header><main class="main"><div class="welcome"><h2 id="welcome"></h2><p>Add tasks, mark them complete, or remove them anytime.</p></div><section class="todo-panel"><div class="add-row"><input id="todoInput" placeholder="What needs to be done?" onkeydown="if(event.key==='Enter')addNewTodo()"><button class="btn" onclick="addNewTodo()">+ Add Task</button></div><div class="stats"><div class="stat">Total: <b id="total">0</b></div><div class="stat">Completed: <b id="completed">0</b></div><div class="stat">Pending: <b id="pending">0</b></div></div><ul id="todoList" class="list"></ul></section></main></div>
<script>
const USERS='taskflow_users', SESSION='taskflow_session', TASKS='taskflow_tasks';
function users(){return JSON.parse(localStorage.getItem(USERS)||'{}')}
function saveUsers(x){localStorage.setItem(USERS,JSON.stringify(x))}
function tasks(){const u=localStorage.getItem(SESSION);return JSON.parse(localStorage.getItem(TASKS+'_'+u)||'[]')}
function saveTasks(x){const u=localStorage.getItem(SESSION);localStorage.setItem(TASKS+'_'+u,JSON.stringify(x))}
function showAuth(mode){document.getElementById('loginForm').classList.toggle('hidden',mode!=='login');document.getElementById('registerForm').classList.toggle('hidden',mode!=='register');document.getElementById('loginTab').classList.toggle('active',mode==='login');document.getElementById('registerTab').classList.toggle('active',mode==='register');document.getElementById('authMsg').textContent=''}
function register(){const u=document.getElementById('regUser').value.trim(),p=document.getElementById('regPass').value.trim();const m=document.getElementById('authMsg');if(!u||!p){m.textContent='Please fill all fields.';return}const db=users();if(db[u]){m.textContent='Username already exists.';return}db[u]=p;saveUsers(db);m.style.color='#16a34a';m.textContent='Registration successful! Please login.';document.getElementById('loginUser').value=u;document.getElementById('regUser').value='';document.getElementById('regPass').value='';showAuth('login');m.style.color='#16a34a';m.textContent='Registration successful! Please login.'}
function login(){const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value.trim(),m=document.getElementById('authMsg');if(users()[u]!==p){m.style.color='#dc2626';m.textContent='Invalid username or password!';return}localStorage.setItem(SESSION,u);document.getElementById('authPage').classList.add('hidden');document.getElementById('todoPage').classList.remove('hidden');document.getElementById('welcome').textContent='Welcome, '+u+' 👋';render()}
function logout(){localStorage.removeItem(SESSION);document.getElementById('todoPage').classList.add('hidden');document.getElementById('authPage').classList.remove('hidden');document.getElementById('loginPass').value='';showAuth('login')}
function addNewTodo(){const input=document.getElementById('todoInput'),text=input.value.trim();if(!text){alert('You must write something!');return}const a=tasks();a.push({id:Date.now(),text,done:false});saveTasks(a);input.value='';render()}
function toggleTask(id){const a=tasks();const t=a.find(x=>x.id===id);if(t)t.done=!t.done;saveTasks(a);render()}
function deleteTask(id){saveTasks(tasks().filter(x=>x.id!==id));render()}
function render(){const list=document.getElementById('todoList'),a=tasks();list.innerHTML='';if(!a.length){list.innerHTML='<li class="empty">No tasks yet. Add your first task 🚀</li>'}else a.forEach(t=>{const li=document.createElement('li');li.className='item'+(t.done?' completed':'');li.innerHTML='<input class="check" type="checkbox" '+(t.done?'checked':'')+' aria-label="Complete task"><span class="task"></span><button class="delete" title="Delete task">×</button>';li.querySelector('.task').textContent=t.text;li.querySelector('.check').onchange=()=>toggleTask(t.id);li.querySelector('.delete').onclick=()=>deleteTask(t.id);list.appendChild(li)});const done=a.filter(x=>x.done).length;document.getElementById('total').textContent=a.length;document.getElementById('completed').textContent=done;document.getElementById('pending').textContent=a.length-done}
if(localStorage.getItem(SESSION)){document.getElementById('authPage').classList.add('hidden');document.getElementById('todoPage').classList.remove('hidden');document.getElementById('welcome').textContent='Welcome, '+localStorage.getItem(SESSION)+' 👋';render()}
</script>
</body></html>
